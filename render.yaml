# Render Blueprint: creates the database, the API and the admin console in one go.
# Render dashboard -> New -> Blueprint -> pick this repository.
# Free plans are fine for trying things out; move to paid plans before real customers
# (free web services sleep when idle, and free databases are not for real data).
databases:
  - name: gaongo-db
    plan: free

services:
  - type: web
    name: gaongo-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run start:prod   # creates/updates tables, then starts the API
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gaongo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_DEV_MODE
        value: "false"
      - key: SMS_PROVIDER
        sync: false        # "http" once you have an SMS provider (see backend/src/lib/sms.js)
      - key: SMS_HTTP_URL
        sync: false
      - key: SMS_HTTP_TOKEN
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      - key: SUPPORT_WHATSAPP
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: gaongo-admin
    runtime: static
    rootDir: apps/admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # e.g. https://gaongo-api.onrender.com
